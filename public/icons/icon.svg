<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 차트 라인 (상승) -->
  <polyline points="80,360 160,300 240,330 320,220 400,160 440,120" fill="none" stroke="url(#line)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 데이터 포인트 -->
  <circle cx="80" cy="360" r="14" fill="#fff"/>
  <circle cx="160" cy="300" r="14" fill="#fff"/>
  <circle cx="240" cy="330" r="14" fill="#fff"/>
  <circle cx="320" cy="220" r="14" fill="#fff"/>
  <circle cx="400" cy="160" r="14" fill="#fff"/>
  <circle cx="440" cy="120" r="14" fill="#ffd700"/>
  <!-- "Q" 문자 (퀀트) -->
  <text x="256" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.95">Q</text>
  <!-- 하단 텍스트 -->
  <text x="256" y="470" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.9">QUANT</text>
</svg>
