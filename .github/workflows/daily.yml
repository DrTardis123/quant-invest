name: Daily Data + Signals + Report
# 평일 16:30 KST = 07:30 UTC: 데이터 fetch + 17:00 신호 + 17:30 알림 + 18:00 리포트

on:
  schedule:
    # 1. 데이터 fetch (16:30 KST = 07:30 UTC)
    - cron: '30 7 * * 1-5'
    # 2. 일일 신호 생성 (17:00 KST = 08:00 UTC)
    - cron: '0 8 * * 1-5'
    # 3. 손절/익절 알림 (17:30 KST = 08:30 UTC)
    - cron: '30 8 * * 1-5'
    # 4. 일일 리포트 (18:00 KST = 09:00 UTC)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: '실행할 작업'
        required: true
        type: choice
        options: ['all', 'data', 'signals', 'alerts', 'report']
        default: 'all'

concurrency:
  group: quant-daily
  cancel-in-progress: false

jobs:
  data:
    if: github.event.inputs.task == 'all' || github.event.inputs.task == 'data'
    name: 1. 데이터 fetch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 24 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: 의존성 설치
        run: npm install --no-audit --no-fund --prefer-offline
      - name: KIS 일봉 증분 fetch
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_PAPER: 'true'
        run: |
          if [ -n "$KIS_APP_KEY" ]; then
            echo "KIS 모의투자 일봉 fetch"
            INCREMENTAL=true N=300 MARKET=BOTH CONCURRENCY=3 node scripts/fetch-kis-5y.js
          else
            echo "KIS 키 없음, Naver로만 진행"
          fi
      - name: 메인 갱신
        run: npm run update
      - name: 변경 확인 + 푸시
        run: |
          if git diff --quiet public/data/ 2>/dev/null; then
            echo "변경 없음"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/
            git commit -m "data: $(date -u +%Y-%m-%d) 자동 갱신"
            git push
          fi

  signals:
    if: github.event.inputs.task == 'all' || github.event.inputs.task == 'signals'
    name: 2. 일일 신호 생성
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: 일일 신호 생성
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: node scripts/daily-signals.js
      - name: 변경 확인 + 푸시
        run: |
          if git diff --quiet public/data/signals.json 2>/dev/null; then
            echo "변경 없음"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/signals.json
            git commit -m "signals: $(date -u +%Y-%m-%d) 신호"
            git push
          fi

  alerts:
    if: github.event.inputs.task == 'all' || github.event.inputs.task == 'alerts'
    name: 3. 손절/익절 알림
    needs: signals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: 손절/익절 알림
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: node scripts/stop-alert.js
      - uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ env.today }}
          path: public/data/alerts.json

  report:
    if: github.event.inputs.task == 'all' || github.event.inputs.task == 'report'
    name: 4. 일일 리포트
    needs: alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: 일일 리포트 생성
        run: node scripts/daily-report.js
      - name: 변경 확인 + 푸시
        run: |
          if git diff --quiet docs/DAILY-*.md 2>/dev/null; then
            echo "변경 없음"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add docs/DAILY-*.md
            git commit -m "report: $(date -u +%Y-%m-%d) 일일 리포트"
            git push
          fi
