name: Update flow regime

# 780c1fe 에서 추가된 외국인 flow regime (3-tier) 필드를
# 평일 17:30 KST (08:30 UTC) 에 자동 갱신.
#
# .github/workflows/daily.yml (17:00 KST) 이후 30분 뒤.
# supply-signals.json의 buy+sell foreign_5d 합산으로 regime 계산 후
# 동일 파일의 regime 필드만 갱신 → commit + push.
#
# 수동 트리거: GitHub UI Actions 탭에서 "Run workflow".

on:
  # 평일 17:30 KST = 08:30 UTC (daily.yml 의 17:00 KST 이후)
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: quant-flow-regime
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # git push 위해

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: regime 갱신
        # 표준 라이브러리만 사용 (urllib + json) → pip install 불필요
        run: |
          set -e
          echo "=== update_flow_regime.py 실행 ==="
          python scripts/update_flow_regime.py 2>&1 | tee logs/flow-regime.log
          echo "=== 완료 ==="

      - name: 변경 확인
        id: check
        run: |
          if git diff --quiet public/data/supply-signals.json 2>/dev/null; then
            echo "변경 없음"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "변경 있음"
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat public/data/supply-signals.json | head -20
          fi

      - name: 커밋 & 푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/supply-signals.json logs/flow-regime.log
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "data(regime): ${TODAY} 외국인 flow regime 자동 갱신"
          git push

      - name: 실패시 로그
        if: failure()
        run: |
          echo "=== 실패 로그 (logs/flow-regime.log) ==="
          if [ -f logs/flow-regime.log ]; then
            tail -100 logs/flow-regime.log
          else
            echo "flow-regime.log 없음"
          fi
