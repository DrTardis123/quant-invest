name: KIS 5년치 일봉 fetch

on:
  # 수동 트리거 (GitHub UI의 Actions 탭에서 "Run workflow")
  workflow_dispatch:
    inputs:
      n:
        description: 'Top N 종목 (KOSPI/KOSDAQ 각각)'
        required: false
        type: string
        default: '300'
      market:
        description: '시장 (KOSPI | KOSDAQ | BOTH)'
        required: false
        type: choice
        options: ['KOSPI', 'KOSDAQ', 'BOTH']
        default: 'BOTH'

concurrency:
  group: kis-5y
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 24 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm install --no-audit --no-fund --prefer-offline

      - name: KIS API 5년치 fetch
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_PAPER: 'true'
          N: ${{ github.event.inputs.n || '300' }}
          MARKET: ${{ github.event.inputs.market || 'BOTH' }}
        run: |
          echo "=== KIS API 5년치 일봉 fetch ==="
          echo "키 등록: $([ -n "$KIS_APP_KEY" ] && echo "OK" || echo "❌ 없음")"
          if [ -z "$KIS_APP_KEY" ]; then
            echo "KIS_APP_KEY secret이 등록되지 않음. Settings → Secrets에서 추가 필요."
            exit 1
          fi
          node scripts/fetch-kis-5y.js 2>&1 | tee logs/kis-5y.log
          echo "=== 완료 ==="

      - name: 변경 확인
        id: check
        run: |
          if git diff --quiet data/ 2>/dev/null; then
            echo "변경 없음"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "변경 있음"
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat data/ | head -20
          fi

      - name: 커밋 & 푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "data(kis): $(date -u +%Y-%m-%d) KIS 5년치 일봉 fetch"
          git push

      - name: 실패시 로그
        if: failure()
        run: |
          echo "=== 실패 로그 ==="
          if [ -f logs/kis-5y.log ]; then
            tail -100 logs/kis-5y.log
          fi
